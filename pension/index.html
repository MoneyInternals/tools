<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Money Internals — Your Pension Is Not a Savings Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0E13; --panel:#121821; --panel2:#161D27; --line:#232A33; --line2:#2C3540;
  --txt:#E6EAF0; --mut:#8B94A3; --mut2:#5F6975;
  --bid:#2EBD85; --ask:#F6465D;
  --relief:#E8B33C; --employer:#4A9EDA;
  --bid-dim:rgba(46,189,133,.14); --ask-dim:rgba(246,70,93,.14);
  --accent:#2EBD85;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:8px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--txt); font-family:var(--sans);
  font-weight:500; font-size:16px; line-height:1.4; -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; min-height:100vh; overflow:hidden;
}
.tnum{font-variant-numeric:tabular-nums}
button{font-family:inherit}

/* ---------- top bar (mirrors terminal) ---------- */
.topbar{
  display:flex; align-items:center; gap:20px; padding:12px 20px;
  border-bottom:1px solid var(--line); background:var(--panel);
}
.brand{display:flex; align-items:center; gap:10px}
.brand .name{font-weight:500; font-size:17px; letter-spacing:.2px}
.brand .name b{color:var(--accent); font-weight:500}
.ticker{
  font-family:var(--mono); font-size:14px; color:var(--mut);
  padding:4px 10px; border:1px solid var(--line2); border-radius:6px; letter-spacing:.5px;
}
.stats{display:flex; gap:22px; margin-left:auto}
.stat-h{display:flex; flex-direction:column; align-items:flex-end; gap:2px}
.stat-h .k{font-size:11px; letter-spacing:1.4px; text-transform:uppercase; color:var(--mut2)}
.stat-h .v{font-family:var(--mono); font-size:20px; font-variant-numeric:tabular-nums}
.stat-h .v.bid{color:var(--bid)}

/* ---------- salary control ---------- */
.salary-bar{
  display:flex; align-items:center; gap:18px;
  padding:12px 20px; border-bottom:1px solid var(--line); background:var(--panel2);
}
.salary-bar label{font-size:11px; letter-spacing:1.4px; text-transform:uppercase; color:var(--mut2)}
.salary-val{font-family:var(--mono); font-size:22px; font-weight:700; min-width:110px}
input[type=range]{
  -webkit-appearance:none; appearance:none; flex:1; max-width:520px; height:4px; border-radius:2px;
  background:linear-gradient(90deg,var(--bid) var(--fill,30%),var(--line2) var(--fill,30%));
  outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:20px; height:20px; border-radius:50%;
  background:var(--bid); border:3px solid var(--bg); cursor:pointer;
}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--bid)}
.presets{display:flex; gap:8px}
.presets button{
  font-family:var(--mono); font-size:14px; padding:8px 14px; border-radius:6px; cursor:pointer;
  background:var(--panel); border:1px solid var(--line2); color:var(--mut); transition:.15s;
}
.presets button:hover{border-color:var(--accent); color:var(--accent)}
.presets button.active{background:var(--accent); border-color:var(--accent); color:#0B0E13; font-weight:700}
.presets button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ---------- main ---------- */
.main{flex:1; display:flex; flex-direction:column; padding:22px 28px 8px; min-height:0}
h1{font-size:clamp(24px,2.8vw,38px); font-weight:600; letter-spacing:-.01em; margin:0 0 6px}
.sub{color:var(--mut); font-size:clamp(15px,1.3vw,19px); margin-bottom:18px; max-width:980px}
.stage{flex:1; min-height:0; display:flex; align-items:stretch; gap:32px}
.viz{flex:1; min-height:0; min-width:0; display:flex}
.viz svg{width:100%; height:100%}
.side{width:360px; flex-shrink:0; display:flex; flex-direction:column; gap:12px; justify-content:center}
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:14px 18px;
}
.card .k{font-size:11px; letter-spacing:1.4px; text-transform:uppercase; color:var(--mut2); margin-bottom:4px}
.card .v{font-family:var(--mono); font-size:28px; font-weight:700; font-variant-numeric:tabular-nums}
.card .v small{font-size:15px; color:var(--mut); font-weight:400}
.card.hero{border-color:var(--bid)}
.card.hero .v{color:var(--bid); font-size:34px}
.legend{display:flex; flex-wrap:wrap; gap:12px 16px; font-size:14px; color:var(--mut); padding:2px 4px}
.legend span{display:flex; align-items:center; gap:7px}
.swatch{width:12px; height:12px; border-radius:3px; display:inline-block}
.callout{
  background:var(--panel); border-left:3px solid var(--relief); border-radius:0 var(--r) var(--r) 0;
  padding:13px 16px; font-size:15px; line-height:1.5;
}
.callout b{color:var(--relief)}
.callout.warn{border-left-color:var(--ask)}
.callout.warn b{color:var(--ask)}
.toggle{
  align-self:flex-start; font-family:var(--mono); font-size:16px; font-weight:700;
  padding:12px 22px; border-radius:6px; cursor:pointer; border:1px solid var(--accent);
  background:var(--accent); color:#0B0E13; transition:.2s;
}
.toggle.off{background:transparent; color:var(--ask); border-color:var(--ask)}
.toggle:focus-visible{outline:2px solid var(--txt); outline-offset:2px}

/* ---------- stepper (mirrors terminal) ---------- */
.stepper{
  display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:18px;
  padding:12px 20px; border-top:1px solid var(--line); background:var(--panel);
}
.scn-count{font-family:var(--mono); font-size:14px; color:var(--mut); letter-spacing:.5px; white-space:nowrap}
.scn-caption{font-size:15px; color:var(--txt)}
.scn-caption b{color:var(--accent)}
.scn-nav{display:flex; gap:8px}
.scn-nav button{
  padding:9px 18px; border-radius:6px; border:1px solid var(--line2); background:var(--panel2);
  color:var(--mut); font-size:14px; font-weight:500; cursor:pointer; transition:.15s;
}
.scn-nav button:hover:not(:disabled){border-color:var(--accent); color:var(--accent)}
.scn-nav button:disabled{opacity:.35; cursor:not-allowed}
.scn-nav .next{background:var(--accent); color:#0B0E13; border-color:var(--accent)}
.scn-nav .next:hover:not(:disabled){filter:brightness(1.07); color:#0B0E13}

/* ---------- footer disclaimer ---------- */
.disclaimer{
  padding:9px 20px; border-top:1px solid var(--line); background:var(--bg);
  font-family:var(--mono); font-size:11.5px; color:var(--mut2); letter-spacing:.3px;
  display:flex; justify-content:space-between; gap:20px; flex-wrap:wrap;
}

/* ---------- animation ---------- */
.evap{animation:evap 1.1s forwards}
@keyframes evap{to{opacity:0; transform:translateY(-26px)}}
.rise{animation:rise .5s both}
@keyframes rise{from{opacity:0; transform:translateY(12px)}to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important; transition:none !important}
}
text{font-family:var(--mono)}

/* ---------- mobile layer ----------
   Never triggers at the 2560×1440 recording size — the recording set is
   untouched. Phones get a scrolling vertical layout with a sticky stepper. */
@media (max-width:760px){
  html,body{height:auto}
  body{overflow:auto; min-height:100vh}

  .topbar{flex-wrap:wrap; gap:10px 14px; padding:10px 14px}
  .ticker{font-size:11px; padding:3px 8px}
  .stats{gap:14px; margin-left:auto}
  .stat-h .v{font-size:16px}

  .salary-bar{flex-wrap:wrap; gap:10px 14px; padding:12px 14px}
  .salary-val{font-size:19px; min-width:0}
  input[type=range]{flex-basis:100%; max-width:none; order:3; height:6px; margin:4px 0}
  .presets{order:4; width:100%}
  .presets button{flex:1; padding:10px 0}

  .main{padding:16px 14px 8px}
  h1{font-size:22px}
  .sub{font-size:15px; margin-bottom:14px}

  .stage{flex-direction:column; gap:16px}
  .viz{display:block; flex:none}
  .viz svg{width:100%; height:auto; aspect-ratio:1000/540}
  .side{width:100%; gap:10px}
  .card{padding:12px 14px}
  .card .v{font-size:24px}
  .card.hero .v{font-size:28px}
  .toggle{align-self:stretch; text-align:center; padding:14px}

  .stepper{
    position:sticky; bottom:0; z-index:5;
    grid-template-columns:auto 1fr; gap:8px 12px; padding:10px 14px;
    box-shadow:0 -8px 24px rgba(0,0,0,.45);
  }
  .scn-caption{grid-column:1 / -1; grid-row:2; font-size:13.5px}
  .scn-nav{justify-self:end}
  .scn-nav button{padding:11px 20px; min-height:44px}

  .disclaimer{
    font-size:10.5px; padding:9px 14px;
    padding-bottom:calc(9px + env(safe-area-inset-bottom));
  }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <svg viewBox="18 12 44 56" width="22" height="28" aria-hidden="true">
      <rect x="22" y="16" width="36" height="5" rx="1.5" fill="#F6465D"/>
      <rect x="26" y="24" width="28" height="5" rx="1.5" fill="#F6465D"/>
      <rect x="30" y="32" width="20" height="5" rx="1.5" fill="#F6465D"/>
      <rect x="30" y="44" width="20" height="5" rx="1.5" fill="#2EBD85"/>
      <rect x="26" y="52" width="28" height="5" rx="1.5" fill="#2EBD85"/>
      <rect x="22" y="60" width="36" height="5" rx="1.5" fill="#2EBD85"/>
    </svg>
    <span class="name">Money<b>Internals</b></span>
  </div>
  <span class="ticker">PENSION / AUTO-ENROLMENT</span>
  <div class="stats">
    <div class="stat-h"><span class="k">Qualifying / yr</span><span class="v tnum" id="st-qual">—</span></div>
    <div class="stat-h"><span class="k">Into pot / mo</span><span class="v bid tnum" id="st-pot">—</span></div>
  </div>
</div>

<div class="salary-bar">
  <label for="salary">Annual salary</label>
  <div class="salary-val tnum" id="salaryVal">£22,000</div>
  <input type="range" id="salary" min="8000" max="60000" step="500" value="22000" aria-label="Annual salary">
  <div class="presets" id="presets">
    <button data-s="12000">£12k</button>
    <button data-s="22000" class="active">£22k</button>
    <button data-s="35000">£35k</button>
  </div>
</div>

<div class="main">
  <h1 id="title"></h1>
  <div class="sub" id="sub"></div>
  <div class="stage">
    <div class="viz" id="viz"></div>
    <div class="side" id="side"></div>
  </div>
</div>

<div class="stepper">
  <span class="scn-count" id="scn-count">1 / 7</span>
  <span class="scn-caption" id="scn-caption"></span>
  <div class="scn-nav">
    <button id="back">← Back</button>
    <button id="next" class="next">Next →</button>
  </div>
</div>

<div class="disclaimer">
  <span>STATUTORY MINIMUMS · 2026/27 QUALIFYING EARNINGS £6,240–£50,270 · 5% GROWTH IS ILLUSTRATIVE, NOT A FORECAST</span>
  <span>EDUCATION, NOT ADVICE — FOR PERSONAL DECISIONS, SPEAK TO A REGULATED ADVISER</span>
</div>

<script>
/* ============ constants (2026/27) ============ */
const LEL = 6240, UEL = 50270;
const R_TAKEHOME = 0.04, R_RELIEF = 0.01, R_EMPLOYER = 0.03;  /* 8% total */
const GROWTH = 0.05;

/* ============ engine ============ */
const qualifying = s => Math.max(0, Math.min(s, UEL) - LEL);

function monthly(s){
  const q = qualifying(s) / 12;
  return {
    takehome: q * R_TAKEHOME,
    relief:   q * R_RELIEF,
    employer: q * R_EMPLOYER,
    total:    q * (R_TAKEHOME + R_RELIEF + R_EMPLOYER),
  };
}

/* future value of monthly contributions, compounded yearly */
function fv(m, years, rate){
  const a = m * 12;
  return rate === 0 ? a * years : a * (Math.pow(1 + rate, years) - 1) / rate;
}
function series(m, years, rate){
  const out = [];
  for(let y = 0; y <= years; y++) out.push(fv(m, y, rate));
  return out;
}

const gbp  = v => '£' + Math.round(v).toLocaleString('en-GB');
const gbpP = v => '£' + v.toLocaleString('en-GB', {minimumFractionDigits:2, maximumFractionDigits:2});

/* ============ svg helpers ============ */
const NS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs){
  const e = document.createElementNS(NS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function makeSVG(w = 1000, h = 540){
  return svgEl('svg', {viewBox:`0 0 ${w} ${h}`, preserveAspectRatio:'xMidYMid meet'});
}
/* On phones the 1000-unit viewBox renders ~370px wide, so SVG text set for
   the recording size becomes illegible. MOB.matches scales it back up.
   Never true at recording resolution. */
const MOB = matchMedia('(max-width:760px)');
MOB.addEventListener('change', () => render());

function txt(svg, x, y, str, size, fill, anchor = 'start', weight = 500){
  if(MOB.matches) size = Math.round(size * 1.35);
  const t = svgEl('text', {x, y, 'font-size':size, fill, 'text-anchor':anchor, 'font-weight':weight});
  t.textContent = str;
  svg.appendChild(t);
  return t;
}
const C = {
  bg:'#0B0E13', panel:'#121821', line:'#232A33', txt:'#E6EAF0', mut:'#8B94A3',
  bid:'#2EBD85', ask:'#F6465D', relief:'#E8B33C', employer:'#4A9EDA'
};

/* ============ state ============ */
let step = 0, pensionOn = true, salary = 22000;
const $ = id => document.getElementById(id);

/* ---------- salary control ---------- */
function setSalary(v, rerender = true){
  salary = v;
  $('salary').value = v;
  $('salaryVal').textContent = gbp(v);
  const pct = (v - 8000) / (60000 - 8000) * 100;
  $('salary').style.setProperty('--fill', pct + '%');
  [...$('presets').children].forEach(b => b.classList.toggle('active', +b.dataset.s === v));
  if(rerender) render();
}
$('salary').addEventListener('input', e => setSalary(+e.target.value));
$('presets').addEventListener('click', e => {
  if(e.target.dataset.s){ setSalary(+e.target.dataset.s); e.target.blur(); }
});

/* ---------- side-panel builders ---------- */
function card(k, v, hero = false, sub = ''){
  return `<div class="card${hero ? ' hero' : ''} rise"><div class="k">${k}</div><div class="v">${v}${sub ? ` <small>${sub}</small>` : ''}</div></div>`;
}
function legend(items){
  return `<div class="legend rise">${items.map(([c, l]) =>
    `<span><i class="swatch" style="background:${c}"></i>${l}</span>`).join('')}</div>`;
}

/* ---------- state 1: the slice ---------- */
function s1(){
  $('title').textContent = 'The pension maths only sees a slice of your salary';
  $('sub').textContent = 'Auto-enrolment percentages apply to “qualifying earnings” — the band between £6,240 and £50,270. Not your whole salary.';
  const q = qualifying(salary);
  const svg = makeSVG(1000, 540);
  const X = 50, W = 900, H = 120, Y = 200;
  const scale = W / Math.max(salary, 36000);
  svg.appendChild(svgEl('rect', {x:X, y:Y, width:salary*scale, height:H, rx:10, fill:C.panel, stroke:C.line}));
  const lelW = Math.min(salary, LEL) * scale;
  svg.appendChild(svgEl('rect', {x:X, y:Y, width:lelW, height:H, rx:10, fill:C.line}));
  txt(svg, X + lelW/2, Y + H/2 + 7, '£6,240', 20, C.mut, 'middle', 700);
  txt(svg, X + lelW/2, Y + H + 40, 'ignored', 16, C.mut, 'middle');
  if(q > 0){
    const qw = (Math.min(salary, UEL) - LEL) * scale;
    svg.appendChild(svgEl('rect', {x:X+lelW, y:Y, width:qw, height:H, rx:10, fill:'rgba(46,189,133,.16)', stroke:C.bid, 'stroke-width':2}));
    txt(svg, X + lelW + qw/2, Y + H/2 + 8, gbp(q), 28, C.bid, 'middle', 700);
    txt(svg, X + lelW + qw/2, Y + H + 40, 'the pension maths only sees this', 17, C.bid, 'middle');
  }
  if(salary > UEL){
    const ow = (salary - UEL) * scale;
    svg.appendChild(svgEl('rect', {x:X + UEL*scale, y:Y, width:ow, height:H, rx:10, fill:C.line}));
    txt(svg, X + UEL*scale + ow/2, Y + H + 40, 'above the band — ignored', 16, C.mut, 'middle');
  }
  txt(svg, X, Y - 28, 'SALARY ' + gbp(salary), 17, C.txt, 'start', 700);
  $('viz').replaceChildren(svg);
  $('side').innerHTML =
    card('Qualifying earnings / year', gbp(q), true) +
    card('Qualifying earnings / month', gbpP(q/12)) +
    `<div class="callout rise">Every percentage in this video is a percentage of <b>this slice</b> — which is why low earners’ contributions look smaller in pounds than they expect.</div>`;
}

/* ---------- shared stack (states 2, 3, 6) ---------- */
function drawStack(m, evaporate = false){
  const svg = makeSVG(1000, 540);
  const segs = [
    {v:m.takehome, c:C.bid,      label:'You, from take-home (4%)', keep:true},
    {v:m.relief,   c:C.relief,   label:'Tax relief (1%)',          keep:false},
    {v:m.employer, c:C.employer, label:'Employer (3%)',            keep:false},
  ];
  const X = 320, W = 220, bottom = 465, scale = 330 / Math.max(m.total, 1);
  let y = bottom;
  segs.forEach(s => {
    const h = s.v * scale;
    y -= h;
    const g = svgEl('g', {});
    g.appendChild(svgEl('rect', {x:X, y, width:W, height:Math.max(h-3,2), rx:8, fill:s.c}));
    const t = svgEl('text', {x:X+W+26, y:y+h/2+7, 'font-size':20, fill:s.c, 'font-weight':700});
    t.textContent = `${gbpP(s.v)}  ·  ${s.label}`;
    g.appendChild(t);
    if(evaporate && !s.keep) g.setAttribute('class', 'evap');
    svg.appendChild(g);
  });
  txt(svg, X + W/2, bottom + 40, 'INTO THE POT / MONTH', 15, C.mut, 'middle');
  txt(svg, X + W/2, 70, evaporate ? gbpP(m.takehome) : gbpP(m.total), 36, evaporate ? C.ask : C.bid, 'middle', 700);
  return svg;
}

/* ---------- state 2: the split ---------- */
function s2(){
  const m = monthly(salary);
  $('title').textContent = 'Every £1 you feel becomes £2 in the pot';
  $('sub').textContent = 'Statutory minimum split: you pay 4% of qualifying earnings from take-home, tax relief adds 1%, your employer adds 3%.';
  $('viz').replaceChildren(drawStack(m));
  $('side').innerHTML =
    card('You feel', gbpP(m.takehome), false, '/ month') +
    card('Lands in the pot', gbpP(m.total), true, '/ month') +
    card('Multiplier before any growth', '×' + (m.total / Math.max(m.takehome, 0.01)).toFixed(1)) +
    legend([[C.bid,'Your take-home'], [C.relief,'Tax relief'], [C.employer,'Employer']]);
}

/* ---------- state 3: toggle it off ---------- */
function s3(){
  const m = monthly(salary);
  $('title').textContent = 'Opt out, and this money never exists';
  $('sub').textContent = 'The employer contribution is not paid as salary instead. The tax relief is not paid at all. Toggle the pension and watch.';
  $('viz').replaceChildren(drawStack(m, !pensionOn));
  const lost = m.relief + m.employer;
  $('side').innerHTML =
    `<button class="toggle${pensionOn ? '' : ' off'}" id="tog">${pensionOn ? 'PENSION: ON' : 'PENSION: OFF'}</button>` +
    (pensionOn
      ? card('In the pot each month', gbpP(m.total), true)
      : card('Take-home rises by', gbpP(m.takehome)) +
        card('Simply ceases to exist', gbpP(lost), false, '/ month') +
        `<div class="callout warn rise">That’s <b>${gbp(lost*12)}</b> a year of employer money and tax relief that no other account can recover.</div>`);
  $('tog').onclick = () => { pensionOn = !pensionOn; s3(); $('tog').blur(); };
}

/* ---------- state 4: ten years, zero growth ---------- */
function s4(){
  const m = monthly(salary);
  const pot = m.total * 120, cost = m.takehome * 120;
  $('title').textContent = 'Ten years. Zero growth. Still double.';
  $('sub').textContent = 'Assume the market does literally nothing for a decade — flat, no growth at all. Just the contributions stacking.';
  const svg = makeSVG(1000, 540);
  const scale = 360 / Math.max(pot, 1), bottom = 450;
  [
    {x:250, v:cost, c:C.mut, label:'COST TO YOUR TAKE-HOME'},
    {x:570, v:pot,  c:C.bid, label:'SITTING IN THE POT'},
  ].forEach(b => {
    const h = b.v * scale;
    svg.appendChild(svgEl('rect', {x:b.x, y:bottom-h, width:200, height:h, rx:10, fill:b.c}));
    txt(svg, b.x+100, bottom-h-18, gbp(b.v), 30, b.c, 'middle', 700);
    txt(svg, b.x+100, bottom+36, b.label, 14, C.mut, 'middle');
  });
  $('viz').replaceChildren(svg);
  $('side').innerHTML =
    card('You put in (take-home)', gbp(cost)) +
    card('Pot after 10 flat years', gbp(pot), true) +
    `<div class="callout rise">No growth assumed in this state. The doubling is the <b>split</b>, not the market.</div>`;
}

/* ---------- line chart helper ---------- */
function lineChart(seriesList, years, yMax, annotate){
  const svg = makeSVG(1000, 540);
  const X0 = 100, X1 = 950, Y0 = 470, Y1 = 40;
  const xs = y => X0 + (X1-X0) * y / years;
  const ys = v => Y0 - (Y0-Y1) * v / yMax;
  for(let g = 0; g <= 4; g++){
    const v = yMax * g / 4, y = ys(v);
    svg.appendChild(svgEl('line', {x1:X0, y1:y, x2:X1, y2:y, stroke:C.line, 'stroke-width':1}));
    txt(svg, X0-12, y+5, gbp(v), 13, C.mut, 'end');
  }
  for(let t = 0; t <= years; t += 10){
    txt(svg, xs(t), Y0+30, t + 'y', 13, C.mut, 'middle');
  }
  seriesList.forEach(s => {
    const pts = s.data.map((v, i) => `${xs(i + (s.offset || 0))},${ys(v)}`).join(' ');
    svg.appendChild(svgEl('polyline', {points:pts, fill:'none', stroke:s.c, 'stroke-width':4, 'stroke-linejoin':'round'}));
    const lastX = xs(s.data.length - 1 + (s.offset || 0)), lastY = ys(s.data[s.data.length-1]);
    svg.appendChild(svgEl('circle', {cx:lastX, cy:lastY, r:7, fill:s.c}));
    txt(svg, lastX-12, lastY-16, gbp(s.data[s.data.length-1]), 22, s.c, 'end', 700);
  });
  if(annotate) annotate(svg, xs, ys);
  return svg;
}

/* ---------- state 5: add growth ---------- */
function s5(){
  const m = monthly(salary);
  const grow = series(m.total, 40, GROWTH);
  const flat = series(m.total, 40, 0);
  const pot = grow[40];
  const contrib = m.total*480, yourCost = m.takehome*480,
        relief = m.relief*480, employer = m.employer*480,
        growth = pot - contrib;
  $('title').textContent = 'Now switch the growth on';
  $('sub').textContent = '5% a year, compounded yearly — an illustration, not a prediction. Same contributions as before. Forty years.';
  $('viz').replaceChildren(lineChart([{data:flat, c:C.mut}, {data:grow, c:C.bid}], 40, pot*1.08));
  $('side').innerHTML =
    card('Pot at 40 years', gbp(pot), true) +
    card('Your take-home cost', gbp(yourCost)) +
    legend([[C.bid, `Growth ${gbp(growth)}`], [C.employer, `Employer ${gbp(employer)}`],
            [C.relief, `Relief ${gbp(relief)}`], [C.mut, 'Grey: zero growth']]) +
    `<div class="callout rise">Most of the final pot is money you never paid in.</div>`;
}

/* ---------- state 6: the average earner ---------- */
function s6(){
  const m = monthly(salary);
  const pot = fv(m.total, 40, GROWTH);
  $('title').textContent = 'Bigger crank. Same machine.';
  $('sub').textContent = 'Around the UK average full-time salary, everything scales up — but every mechanism is identical: the split, the free money, the compounding.';
  $('viz').replaceChildren(drawStack(m));
  $('side').innerHTML =
    card('You feel', gbpP(m.takehome), false, '/ month') +
    card('Pot at 40 years (5% illus.)', gbp(pot), true) +
    card('Your total take-home cost', gbp(m.takehome*480)) +
    `<div class="callout rise">These are the <b>legal minimums</b> — many employers pay in more than 3%, or add extra if you raise yours. It’s on your scheme’s website. And above £50,270 the band stops growing entirely — what the system does to higher earners is its own video.</div>`;
}

/* ---------- state 7: 25 vs 35 ---------- */
function s7(){
  const m = monthly(salary);
  const a25 = series(m.total, 40, GROWTH);
  const a35 = series(m.total, 30, GROWTH);
  const gap = a25[40] - a35[30];
  const decadeCost = m.takehome * 120;
  $('title').textContent = 'The most expensive decade is the one you skip';
  $('sub').textContent = 'Two identical people, identical salary, identical contributions. One starts at 25, one at 35. Both stop at 65.';
  $('viz').replaceChildren(lineChart(
    [{data:a35, c:C.ask, offset:10}, {data:a25, c:C.bid}],
    40, a25[40]*1.08,
    (svg, xs, ys) => {
      const x = xs(40);
      const yTop = ys(a25[40]), yBot = ys(a35[30]), yMid = (yTop + yBot) / 2;
      svg.appendChild(svgEl('line', {x1:x-2, y1:yTop, x2:x-2, y2:yBot,
        stroke:C.relief, 'stroke-width':3, 'stroke-dasharray':'7 6'}));
      /* badge: dark pill behind the label so it reads over any line */
      const M = MOB.matches ? 1.35 : 1;
      const label = 'GAP ' + gbp(gap), bw = label.length * 13.5 * M + 28;
      svg.appendChild(svgEl('rect', {x:x-24-bw, y:yMid-21*M, width:bw, height:42*M, rx:8,
        fill:C.panel, stroke:C.relief, 'stroke-width':1.5}));
      txt(svg, x-24-bw/2, yMid+8*M, label, 22, C.relief, 'middle', 700);
    }
  ));
  $('side').innerHTML =
    card('Start at 25 — pot at 65', gbp(a25[40]), true) +
    card('Start at 35 — pot at 65', gbp(a35[30])) +
    card('The gap', gbp(gap)) +
    `<div class="callout rise">Those ten extra years cost <b>${gbp(decadeCost)}</b> of take-home — and bought <b>${gbp(gap)}</b>. Time did the rest.</div>`;
}

/* ============ stepper (mirrors terminal) ============ */
const states = [
  {fn:s1, cap:'<b>State 1</b> — qualifying earnings: the slice the maths can see'},
  {fn:s2, cap:'<b>State 2</b> — the split: 4% you + 1% relief + 3% employer'},
  {fn:s3, cap:'<b>State 3</b> — opt out and the free money never exists'},
  {fn:s4, cap:'<b>State 4</b> — ten years with zero growth: still double'},
  {fn:s5, cap:'<b>State 5</b> — growth on: 5% illustration over 40 years'},
  {fn:s6, cap:'<b>State 6</b> — the average earner: bigger crank, same machine'},
  {fn:s7, cap:'<b>State 7</b> — start at 25 vs 35: the cost of the skipped decade'},
];

function render(){
  const m = monthly(salary);
  $('st-qual').textContent = gbp(qualifying(salary));
  $('st-pot').textContent  = gbpP(m.total);
  states[step].fn();
  $('scn-caption').innerHTML = states[step].cap;
  $('scn-count').textContent = `${step+1} / ${states.length}`;
  $('back').disabled = step === 0;
  $('next').disabled = step === states.length - 1;
}

function goTo(n){
  step = Math.max(0, Math.min(states.length - 1, n));
  pensionOn = true;
  if(step === 5 && salary !== 35000) setSalary(35000, false);   /* state 6 = average earner */
  if(step === 6 && salary === 35000) setSalary(22000, false);   /* state 7 back on £22k */
  render();
}
$('next').addEventListener('click', () => { goTo(step + 1); $('next').blur(); });
$('back').addEventListener('click', () => { goTo(step - 1); $('back').blur(); });

document.addEventListener('keydown', e => {
  const a = document.activeElement;
  if(a && (a.tagName === 'INPUT' || a.tagName === 'BUTTON')) return;   /* slider keeps its arrows */
  if(e.key === 'ArrowRight'){ e.preventDefault(); goTo(step + 1); }
  if(e.key === 'ArrowLeft'){  e.preventDefault(); goTo(step - 1); }
  if(/^[1-7]$/.test(e.key))   goTo(+e.key - 1);
});

/* ---- boot ---- */
setSalary(22000, false);
render();
</script>
