<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The 20% Nobody Claims — Money Internals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0E13; --panel:#121821; --panel2:#171F2A; --line:#232A33; --line2:#2C3540;
  --txt:#E6EAF0; --mut:#8B94A3; --mut2:#5C6675;
  --bid:#2EBD85; --ask:#F6465D; --relief:#E8B33C; --employer:#4A9EDA;
  --accent:#2EBD85;
  --sans:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  --r:10px;
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt); font-family:var(--sans); font-weight:500;
  display:flex; flex-direction:column; overflow:hidden;
}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- topbar ---------- */
.topbar{
  display:flex; align-items:center; gap:26px; padding:12px 20px;
  border-bottom:1px solid var(--line); background:var(--panel);
}
.brand{display:flex; align-items:center; gap:10px}
.brand .name{font-size:16px; letter-spacing:.3px}
.brand .name b{color:var(--bid); font-weight:700}
.ticker{font-family:var(--mono); font-size:12px; color:var(--mut); letter-spacing:2px}
.stats{margin-left:auto; display:flex; gap:26px}
.stat-h{display:flex; flex-direction:column; align-items:flex-end}
.stat-h .k{font-size:10px; letter-spacing:1.3px; text-transform:uppercase; color:var(--mut2)}
.stat-h .v{font-family:var(--mono); font-size:17px; font-weight:700}
#st-relief.pending{color:var(--ask)}
#st-relief.paid{color:var(--bid)}

/* ---------- layout ---------- */
.stage{flex:1; display:grid; grid-template-columns:1fr 360px; min-height:0}
.main{display:flex; flex-direction:column; padding:22px 26px 10px; min-width:0}
.main h1{font-size:26px; font-weight:700; letter-spacing:-.3px}
.main .sub{color:var(--mut); font-size:15px; margin-top:6px; line-height:1.45; max-width:70ch}
.viz{flex:1; margin-top:14px; min-height:0; display:flex; align-items:stretch}
.viz svg{width:100%; height:100%}
.side{
  border-left:1px solid var(--line); background:var(--panel); padding:18px;
  display:flex; flex-direction:column; gap:12px; overflow-y:auto;
}
.card{background:var(--panel2); border:1px solid var(--line); border-radius:var(--r); padding:13px 16px}
.card .k{font-size:11px; letter-spacing:1.4px; text-transform:uppercase; color:var(--mut2); margin-bottom:4px}
.card .v{font-family:var(--mono); font-size:26px; font-weight:700; font-variant-numeric:tabular-nums}
.card .v small{font-size:14px; color:var(--mut); font-weight:500}
.card.hero{border-color:var(--bid)}
.card.hero .v{color:var(--bid); font-size:31px}
.card.bad{border-color:var(--ask)}
.card.bad .v{color:var(--ask)}
.card.gold .v{color:var(--relief)}
.callout{
  background:var(--panel2); border-left:3px solid var(--relief); border-radius:0 var(--r) var(--r) 0;
  padding:12px 15px; font-size:14.5px; line-height:1.5;
}
.callout b{color:var(--relief)}
.callout.warn{border-left-color:var(--ask)}
.callout.warn b{color:var(--ask)}
.callout.good{border-left-color:var(--bid)}
.callout.good b{color:var(--bid)}

/* ---------- controls strip ---------- */
.controls{
  display:flex; align-items:center; gap:22px; flex-wrap:wrap;
  padding:12px 26px; border-top:1px solid var(--line); background:var(--panel);
}
.ctl{display:flex; align-items:center; gap:12px}
.ctl.hidden{display:none}
.ctl .lbl{font-size:11px; letter-spacing:1.3px; text-transform:uppercase; color:var(--mut2); white-space:nowrap}
.ctl .val{font-family:var(--mono); font-size:16px; font-weight:700; min-width:96px}
.ctl .val.green{color:var(--bid)}
input[type=range]{
  -webkit-appearance:none; appearance:none; width:220px; height:6px; border-radius:3px;
  background:linear-gradient(to right, var(--accent) var(--fill,0%), var(--line2) var(--fill,0%));
  outline:none; cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:18px; height:18px; border-radius:50%;
  background:var(--txt); border:3px solid var(--accent); cursor:grab;
}
input[type=range]:focus-visible{outline:2px solid var(--txt); outline-offset:3px}
#netRange{background:linear-gradient(to right, var(--relief) var(--fill,0%), var(--line2) var(--fill,0%))}
#netRange::-webkit-slider-thumb{border-color:var(--relief)}

/* the hook control — one toggle, one state change */
.toggle{
  font-family:var(--mono); font-size:13px; padding:9px 16px; border-radius:6px;
  border:1px solid var(--line2); background:var(--panel2); color:var(--mut);
  cursor:pointer; transition:.15s; letter-spacing:.5px;
}
.toggle:hover{border-color:var(--accent); color:var(--accent)}
.toggle.on{background:var(--bid); border-color:var(--bid); color:#0B0E13; font-weight:700}
.toggle.off{background:var(--ask); border-color:var(--ask); color:#0B0E13; font-weight:700}
.presets{display:flex; gap:6px}
.presets button{
  font-family:var(--mono); font-size:12.5px; padding:7px 11px; border-radius:6px;
  border:1px solid var(--line2); background:var(--panel2); color:var(--mut); cursor:pointer; transition:.15s;
}
.presets button:hover{border-color:var(--accent); color:var(--accent)}
.presets button.active{background:var(--accent); border-color:var(--accent); color:#0B0E13; font-weight:700}

/* ---------- stepper ---------- */
.stepper{
  display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:18px;
  padding:11px 20px; border-top:1px solid var(--line); background:var(--panel);
}
.scn-count{font-family:var(--mono); font-size:14px; color:var(--mut); letter-spacing:.5px; white-space:nowrap}
.scn-caption{font-size:15px}
.scn-caption b{color:var(--accent)}
.scn-nav{display:flex; gap:8px}
.scn-nav button{
  padding:9px 18px; border-radius:6px; border:1px solid var(--line2); background:var(--panel2);
  color:var(--mut); font-size:14px; font-weight:500; cursor:pointer; transition:.15s;
}
.scn-nav button:hover:not(:disabled){border-color:var(--accent); color:var(--accent)}
.scn-nav button:disabled{opacity:.35; cursor:not-allowed}
.scn-nav .next{background:var(--accent); color:#0B0E13; border-color:var(--accent)}
.scn-nav .next:hover:not(:disabled){filter:brightness(1.07); color:#0B0E13}

/* ---------- footer disclaimer ---------- */
.disclaimer{
  padding:9px 20px; border-top:1px solid var(--line); background:var(--bg);
  font-family:var(--mono); font-size:11.5px; color:var(--mut2); letter-spacing:.3px;
  display:flex; justify-content:space-between; gap:20px; flex-wrap:wrap;
}

/* ---------- short-viewport guard ----------
   The controls strip and stepper must never be pushed off the bottom.
   At reduced heights the padding compresses and the viz absorbs it. */
@media (max-height:820px){
  .main{padding:14px 22px 8px}
  .main h1{font-size:22px}
  .main .sub{font-size:14px}
  .controls{padding:9px 22px; gap:16px}
  .stepper{padding:8px 20px}
  .side{padding:14px; gap:9px}
  .card{padding:10px 13px}
  .card .v{font-size:22px}
  .card.hero .v{font-size:26px}
}

/* ---------- animation ---------- */
.rise{animation:rise .5s both}
@keyframes rise{from{opacity:0; transform:translateY(12px)}to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}
text{font-family:var(--mono)}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <svg viewBox="18 12 44 56" width="22" height="28" aria-hidden="true">
      <rect x="22" y="16" width="36" height="5" rx="1.5" fill="#F6465D"/>
      <rect x="26" y="24" width="28" height="5" rx="1.5" fill="#F6465D"/>
      <rect x="30" y="32" width="20" height="5" rx="1.5" fill="#F6465D"/>
      <rect x="30" y="44" width="20" height="5" rx="1.5" fill="#2EBD85"/>
      <rect x="26" y="52" width="28" height="5" rx="1.5" fill="#2EBD85"/>
      <rect x="22" y="60" width="36" height="5" rx="1.5" fill="#2EBD85"/>
    </svg>
    <span class="name">Money<b>Internals</b></span>
  </div>
  <span class="ticker">TAX / RELIEF AT SOURCE</span>
  <span class="ticker" id="st-year" style="color:var(--relief)">TAX YEAR —</span>
  <div class="stats">
    <div class="stat-h"><span class="k">Salary</span><span class="v tnum" id="st-salary">—</span></div>
    <div class="stat-h"><span class="k">Out of your bank</span><span class="v tnum" id="st-net">—</span></div>
    <div class="stat-h"><span class="k">Into the pot</span><span class="v tnum" id="st-pot" style="color:var(--relief)">—</span></div>
    <div class="stat-h"><span class="k">Back to you</span><span class="v tnum" id="st-relief">—</span></div>
  </div>
</div>

<div class="stage">
  <div class="main">
    <h1 id="title">—</h1>
    <div class="sub" id="sub">—</div>
    <div class="viz" id="viz"></div>
  </div>
  <div class="side" id="side"></div>
</div>

<div class="controls">
  <div class="ctl" id="ctl-net">
    <span class="lbl">You pay from take-home</span>
    <input type="range" id="netRange" min="0" max="8000" step="50" value="4000" aria-label="Contribution paid from take-home">
    <span class="val tnum" id="netVal">—</span>
  </div>
  <div class="ctl" id="ctl-salary">
    <span class="lbl">Salary</span>
    <input type="range" id="salary" min="50000" max="140000" step="250" value="100000" aria-label="Salary">
    <span class="val tnum" id="salaryVal">—</span>
  </div>
  <div class="ctl" id="ctl-claim">
    <span class="lbl">Higher-rate relief</span>
    <button class="toggle" id="claimBtn" aria-pressed="false">—</button>
  </div>
  <div class="ctl presets" id="ctl-presets">
    <button data-salary="60000">£60,000</button>
    <button data-salary="100000" class="active">£100,000</button>
    <button data-salary="110000">£110,000</button>
  </div>
</div>

<div class="stepper">
  <span class="scn-count" id="scnCount">—</span>
  <span class="scn-caption" id="scnCaption">—</span>
  <span class="scn-nav">
    <button id="prev">← Back</button>
    <button id="next" class="next">Next →</button>
  </span>
</div>

<div class="disclaimer">
  <span>EDUCATION, NOT FINANCIAL ADVICE · MECHANICS ONLY</span>
  <span id="disc-year">ENGLAND, WALES &amp; NI · —</span>
  <span id="disc-build">MONEYINTERNALS.COM</span>
</div>

<script>
/* ============================================================
   REGISTERED ASSUMPTIONS — verify against HMRC before recording
   ============================================================ */
const TAX_YEAR   = '2026/27';
const JURIS      = 'England, Wales & NI';
const BUILD      = 'ep03-b15';   // bump on every edit — visible bottom-right
const PA         = 12570;   // personal allowance
const BASIC_LIMIT= 37700;   // taxable income taxed at 20%
const ADDL_LIMIT = 125140;  // taxable income where 45% starts
const TAPER_START= 100000;  // ANI above this erodes the allowance
const BASIC_RATE = 0.20, HIGHER_RATE = 0.40, ADDL_RATE = 0.45;
const BACKDATE_YEARS = 4;   // "up to the last 4 tax years"
/* NI is illustrative only — used solely to make the payslip panel look real.
   Nothing in the relief calculation depends on it. VERIFY before recording. */
const NI_LOWER = 12570, NI_UPPER = 50270, NI_MAIN = 0.08, NI_UPPER_RATE = 0.02;
function niDue(salary){
  return Math.max(0, Math.min(salary, NI_UPPER) - NI_LOWER) * NI_MAIN
       + Math.max(0, salary - NI_UPPER) * NI_UPPER_RATE;
}

/* ============================================================
   ENGINE — two calls to one function, differenced
   ============================================================ */
function allowanceFor(ani){
  if(ani <= TAPER_START) return PA;
  return Math.max(0, PA - Math.floor((ani - TAPER_START) / 2));
}

function taxDue(salary, ani, extension){
  const taxable = Math.max(0, salary - allowanceFor(ani));
  const basicLimit  = BASIC_LIMIT + extension;
  const higherLimit = ADDL_LIMIT  + extension;

  const basic  = Math.min(taxable, basicLimit);
  const higher = Math.min(Math.max(taxable - basicLimit, 0), higherLimit - basicLimit);
  const addl   = Math.max(taxable - higherLimit, 0);

  return basic*BASIC_RATE + higher*HIGHER_RATE + addl*ADDL_RATE;
}

function model(salary, net){
  const gross  = net / 0.8;            // provider grosses up at basic rate
  const topUp  = gross - net;          // straight into the pot
  const before = taxDue(salary, salary, 0);
  const after  = taxDue(salary, salary - gross, gross);
  const relief = before - after;       // what comes back to YOU
  return {
    gross, topUp, before, after, relief,
    net,
    outOfPocket: net - relief,
    aniBefore: salary,
    aniAfter: salary - gross,
    paBefore: allowanceFor(salary),
    paAfter: allowanceFor(salary - gross),
    paGain: allowanceFor(salary - gross) - allowanceFor(salary)
  };
}

/* ============================================================
   STATE
   ============================================================ */
let salary = 100000, net = 4000, claimed = false, scene = 0, payslip = false, reach = false, taxcode = false, reveal = 0;

/* ============================================================
   HELPERS
   ============================================================ */
const $ = id => document.getElementById(id);
const gbp = n => '£' + Math.round(n).toLocaleString('en-GB');
const C = {
  bid:'#2EBD85', ask:'#F6465D', relief:'#E8B33C', employer:'#4A9EDA',
  txt:'#E6EAF0', mut:'#8B94A3', mut2:'#5C6675', line:'#232A33', panel:'#171F2A'
};

function svgEl(tag, attrs){
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function makeSVG(){
  return svgEl('svg', {viewBox:'0 0 1000 520', preserveAspectRatio:'xMidYMid meet'});
}
function txt(svg, x, y, s, size, fill, anchor, weight){
  const t = svgEl('text', {x, y, 'font-size':size||14, fill:fill||C.txt,
    'text-anchor':anchor||'start', 'font-weight':weight||500});
  t.textContent = s;
  svg.appendChild(t);
  return t;
}
function card(k, v, cls, small){
  return `<div class="card ${cls||''} rise"><div class="k">${k}</div>`
       + `<div class="v tnum">${v}${small ? ' <small>'+small+'</small>' : ''}</div></div>`;
}


/* ============================================================
   PAYSLIP COMPARISON — scene 1, toggled with P
   Monthly figures. The gap between the two take-home lines IS
   the unclaimed higher-rate relief. Derived, never hand-typed.
   ============================================================ */
function drawPayslips(svg){
  const m = model(salary, net);
  const mo = x => x / 12;

  const taxOffGross = taxDue(salary - m.gross, salary - m.gross, 0);
  const taxOffNet   = taxDue(salary, salary, 0);
  const ni          = niDue(salary);

  const homeA = mo(salary) - mo(m.gross) - mo(taxOffGross) - mo(ni);
  const payB  = mo(salary) - mo(taxOffNet) - mo(ni);
  const homeB = payB - mo(net);

  const money = v => '£' + v.toLocaleString('en-GB',{minimumFractionDigits:2, maximumFractionDigits:2});

  const panels = [
    { x:56, hot:C.bid, title:'COMES OFF YOUR GROSS PAY',
      note:'salary sacrifice / net pay', verdict:'NOTHING TO CLAIM',
      rows:[
        ['Gross pay',            money(mo(salary)),   false],
        ['Pension',              '−'+money(mo(m.gross)), false],
        ['Taxable pay',          money(mo(salary)-mo(m.gross)), 'hot'],
        ['Income tax',           '−'+money(mo(taxOffGross)), false],
        ['National Insurance',   '−'+money(mo(ni)),   false],
        ['TAKE-HOME',            money(homeA),        'total']
      ],
      flag:'lower than gross pay' },
    { x:512, hot:C.ask, title:'COMES OUT OF YOUR TAKE-HOME',
      note:'relief at source', verdict:'SOMETHING LEFT TO CLAIM',
      rows:[
        ['Gross pay',            money(mo(salary)),   false],
        ['Taxable pay',          money(mo(salary)),   'hot'],
        ['Income tax',           '−'+money(mo(taxOffNet)), false],
        ['National Insurance',   '−'+money(mo(ni)),   false],
        ['Paid to you',          money(payB),         false],
        ['Pension leaves bank',  '−'+money(mo(net)),  false],
        ['LEFT',                 money(homeB),        'total']
      ],
      flag:'identical to gross pay' }
  ];

  txt(svg, 500, 30, 'THE PAYSLIP TEST — ONE MONTH, SAME £' +
      Math.round(m.gross).toLocaleString('en-GB') + ' INTO THE POT', 14, C.mut2, 'middle', 700);

  panels.forEach(p => {
    svg.appendChild(svgEl('rect',{x:p.x, y:48, width:432, height:352, rx:12,
      fill:C.panel, stroke:p.hot, 'stroke-width':2}));
    txt(svg, p.x+20, 78, p.title, 13, p.hot, 'start', 700);
    txt(svg, p.x+20, 98, p.note, 12, C.mut2, 'start');

    p.rows.forEach((r,i) => {
      const y = 130 + i*36;
      if(r[2] === 'hot'){
        svg.appendChild(svgEl('rect',{x:p.x+12, y:y-20, width:408, height:30, rx:5,
          fill: p.hot === C.bid ? 'rgba(46,189,133,.16)' : 'rgba(246,70,93,.14)'}));
      }
      if(r[2] === 'total'){
        svg.appendChild(svgEl('line',{x1:p.x+20, y1:y-24, x2:p.x+412, y2:y-24,
          stroke:C.line2, 'stroke-width':1}));
      }
      const bold = r[2] === 'total' ? 700 : 500;
      const col  = r[2] === 'hot' ? p.hot : (r[2] === 'total' ? C.txt : C.mut);
      txt(svg, p.x+20,  y, r[0], r[2]==='total'?14:13, col, 'start', bold);
      txt(svg, p.x+412, y, r[1], r[2]==='total'?16:14, col, 'end', bold);
      if(r[2] === 'hot') txt(svg, p.x+20, y+16, p.flag, 10, p.hot, 'start', 700);
    });

    txt(svg, p.x+216, 384, p.verdict, 12, p.hot, 'middle', 700);
  });

  txt(svg, 500, 434, 'Look for taxable pay. Lower than gross pay — the pension already came off before tax.',
      14, C.mut, 'middle');
  txt(svg, 500, 460, 'Same as gross pay — it came out afterwards, and the higher-rate slice is still sitting there.',
      14, C.mut, 'middle');
  txt(svg, 500, 496, 'Difference in take-home: ' + money(homeA - homeB) + ' a month · ' +
      '£' + Math.round((homeA-homeB)*12).toLocaleString('en-GB') + ' a year',
      17, C.relief, 'middle', 700);
}


/* ============================================================
   WHO THIS APPLIES TO — scene 1, toggled with W
   ============================================================ */
function drawReach(svg){
  const x0 = 70, W = 860, MAX = 150000;
  const px = v => x0 + (Math.min(v, MAX) / MAX) * W;

  const bands = [
    [0,      PA,          '#1A222E', 'ALLOWANCE',  '0%'],
    [PA,     50270,       '#233040', 'BASIC',      '20%'],
    [50270,  ADDL_LIMIT,  'rgba(46,189,133,.20)', 'HIGHER', '40%'],
    [ADDL_LIMIT, MAX,     'rgba(46,189,133,.30)', 'ADDITIONAL', '45%']
  ];

  txt(svg, 500, 40, 'WHO THIS VIDEO IS ABOUT', 14, C.mut2, 'middle', 700);

  bands.forEach(b => {
    const w = px(b[1]) - px(b[0]);
    const on = b[0] >= 50270;
    svg.appendChild(svgEl('rect',{x:px(b[0]), y:110, width:w, height:78, rx:4,
      fill:b[2], stroke: on ? C.bid : C.line, 'stroke-width': on ? 2 : 1}));
    if(w > 70){
      txt(svg, px(b[0])+w/2, 143, b[3], 11, on ? C.bid : C.mut2, 'middle', 700);
      txt(svg, px(b[0])+w/2, 168, b[4], 17, on ? C.bid : C.mut, 'middle', 700);
    }
  });

  // the threshold
  svg.appendChild(svgEl('line',{x1:px(50270), y1:92, x2:px(50270), y2:212,
    stroke:C.relief, 'stroke-width':3}));
  txt(svg, px(50270), 82, '£50,270', 20, C.relief, 'middle', 700);
  txt(svg, px(50270), 232, 'higher rate starts here', 12, C.relief, 'middle', 700);

  // where this video sits
  svg.appendChild(svgEl('path',{d:'M '+px(salary)+' 292 l -9 -16 l 18 0 z', fill:C.txt}));
  txt(svg, px(salary), 314, gbp(salary), 15, C.txt, 'middle', 700);
  txt(svg, px(salary), 334, 'used in this video', 11, C.mut2, 'middle');

  svg.appendChild(svgEl('rect',{x:70, y:366, width:415, height:104, rx:10,
    fill:C.panel, stroke:C.line}));
  txt(svg, 90, 396, 'BELOW £50,270', 12, C.mut2, 'start', 700);
  txt(svg, 90, 424, 'Your provider claims the basic rate.', 14, C.mut, 'start');
  txt(svg, 90, 448, 'That is all the relief there is.', 14, C.mut, 'start');

  svg.appendChild(svgEl('rect',{x:515, y:366, width:415, height:104, rx:10,
    fill:C.panel, stroke:C.bid, 'stroke-width':2}));
  txt(svg, 535, 396, 'FROM £50,271 UPWARD', 12, C.bid, 'start', 700);
  txt(svg, 535, 424, 'There is a higher-rate slice —', 14, C.txt, 'start');
  txt(svg, 535, 448, 'and it is never automatic.', 14, C.bid, 'start', 700);

  txt(svg, 500, 500, 'The mechanism is identical anywhere in the green. Only the size of the slice changes.',
      13, C.mut2, 'middle');
}

/* ============================================================
   TAX CODE GOES STALE — scene 4, toggled with T
   ============================================================ */
function drawTaxCode(svg){
  txt(svg, 500, 36, 'IF YOU TAKE THE TAX CODE ROUTE', 14, C.mut2, 'middle', 700);

  const steps = [
    ['1','YOU CLAIM','HMRC works out this year\u2019s relief', C.bid],
    ['2','CODE ADJUSTED','It assumes next year looks the same', C.relief],
    ['3','SOMETHING CHANGES','Pay rise · contribution change · sacrifice', C.ask],

/* ============================================================
   RENDER
   ============================================================ */
/* Rebuilding the sidebar on every slider tick restarts each card's
   entry animation, which reads as flicker. Rebuild only when the
   structure changes (new scene); otherwise swap values in place. */
let sideKey = null;
function renderSide(html, key){
  const el = $('side');
  if(key !== sideKey){
    el.innerHTML = html;
    sideKey = key;
    return;
  }
  const tmp = document.createElement('div');
  tmp.innerHTML = html;

  // card wrappers: class only (hero/bad/gold can flip) — never touch their children
  const oldCards = el.querySelectorAll('.card');
  const newCards = tmp.querySelectorAll('.card');
  // text-bearing nodes: swap innerHTML, nested <small>/<b> included
  const oldTxt = el.querySelectorAll('.card .k, .card .v, .callout');
  const newTxt = tmp.querySelectorAll('.card .k, .card .v, .callout');

  if(oldCards.length !== newCards.length || oldTxt.length !== newTxt.length){
    el.innerHTML = html;
    return;
  }
  oldCards.forEach((n, i) => {
    if(n.className !== newCards[i].className) n.className = newCards[i].className;
  });
  oldTxt.forEach((n, i) => {
    if(n.innerHTML !== newTxt[i].innerHTML) n.innerHTML = newTxt[i].innerHTML;
  });
}

function render(){
  const s = scenes[scene];
  const m = model(salary, net);

  // topbar
  $('st-year').textContent = 'TAX YEAR ' + TAX_YEAR;
  $('disc-year').textContent = JURIS.toUpperCase() + ' · ' + TAX_YEAR;
  $('disc-build').textContent = 'MONEYINTERNALS.COM · ' + BUILD;
  $('st-salary').textContent = gbp(salary);
  $('st-net').textContent = gbp(m.net);
  $('st-pot').textContent = gbp(m.gross);
  $('st-relief').textContent = claimed ? gbp(m.relief) : '—';
  $('st-relief').className = 'v tnum ' + (claimed ? 'paid' : 'pending');

  // heading
  const isPay  = (scene === 0 && payslip);
  const isReach= (scene === 0 && reach);
  const isCode = (scene === 3 && taxcode);
  $('title').textContent = isPay ? 'The payslip test'
    : isReach ? 'Who this actually applies to'
    : isCode ? 'Why a tax code goes stale'
    : s.title;
  $('sub').textContent = isPay
    ? 'Two payslips, same salary, same £5,000 going into a pension. One has already delivered all the relief. The other has not — and the difference shows up in take-home pay.'
    : isReach
    ? 'The higher-rate slice exists from £50,271 upward. This video uses £100,000 because the arithmetic is cleaner, not because the mechanism is different.'
    : isCode
    ? 'The tax code route pays the relief through future payslips. That means it works from an estimate of a year that has not happened yet.'
    : s.sub;

  // viz
  const svg = makeSVG();
  s.draw(svg);
  $('viz').replaceChildren(svg);

  // side
  renderSide(s.side(), s.id + (s.id==='payoff'? ':r'+(reveal>=6?6:0) : '') + (payslip?':pay':'') + (reach?':reach':'') + (taxcode?':code':''));

  // controls
  $('ctl-net').classList.toggle('hidden', !s.controls.net);
  $('ctl-salary').classList.toggle('hidden', !s.controls.salary);
  $('ctl-claim').classList.toggle('hidden', !s.controls.claim);
  $('ctl-presets').classList.toggle('hidden', !s.controls.presets);

  $('netVal').textContent = gbp(net);
  $('salaryVal').textContent = gbp(salary);
  $('claimBtn').textContent = claimed ? 'CLAIMED' : 'NOT CLAIMED';
  $('claimBtn').className = 'toggle ' + (claimed ? 'on' : 'off');
  $('claimBtn').setAttribute('aria-pressed', claimed ? 'true' : 'false');

  fill($('netRange'));
  fill($('salary'));

  // stepper
  $('scnCount').textContent = String(scene+1).padStart(2,'0') + ' / ' + String(scenes.length).padStart(2,'0');
  $('scnCaption').innerHTML = isPay
    ? 'Find <b>taxable pay</b> — lower than gross, or the same as gross?'
    : isReach
    ? 'Identical mechanism <b>anywhere above £50,270</b> — only the slice changes'
    : isCode
    ? 'The code carries an <b>estimate</b> forward — and estimates drift'
    : s.caption;
  $('prev').disabled = scene === 0;
  $('next').disabled = (scene === scenes.length - 1) && !(scenes[scene].id === 'payoff' && reveal < 6);

  document.querySelectorAll('#ctl-presets button').forEach(b=>{
    b.classList.toggle('active', +b.dataset.salary === salary);
  });
}

function fill(el){
  const pct = (el.value - el.min) / (el.max - el.min) * 100;
  el.style.setProperty('--fill', pct + '%');
}

/* ============================================================
   EVENTS
   ============================================================ */
/* Render synchronously. Do NOT put this behind requestAnimationFrame:
   Chrome pauses rAF when it thinks the window isn't visible, which is
   what happens in --app mode behind OBS window capture. */
function goto(n){
  scene = Math.max(0, Math.min(scenes.length-1, n));
  reveal = 0;
  render();
}
/* On the payoff scene, → and Next reveal the numbers one at a time
   so each lands on the word, instead of the screen sitting static. */
function advance(){
  if(scenes[scene].id === 'payoff' && reveal < 6){ reveal++; render(); return; }
  goto(scene + 1);
}

$('netRange').addEventListener('input', e => { net = +e.target.value; render(); });
$('salary').addEventListener('input', e => { salary = +e.target.value; render(); });
$('claimBtn').addEventListener('click', () => { claimed = !claimed; render(); });
document.querySelectorAll('#ctl-presets button').forEach(b=>{
  b.addEventListener('click', () => { salary = +b.dataset.salary; $('salary').value = salary; render(); });
});
$('prev').addEventListener('click', () => goto(scene-1));
$('next').addEventListener('click', advance);

document.addEventListener('keydown', e => {
  const a = document.activeElement;
  if(a && (a.tagName === 'INPUT' || a.tagName === 'BUTTON')) return;
  if(e.key === 'ArrowRight'){ e.preventDefault(); advance(); }
  if(e.key === 'ArrowLeft'){  e.preventDefault(); goto(scene - 1); }
  if(/^[1-8]$/.test(e.key))   goto(+e.key - 1);
  if(e.key === 'c' || e.key === 'C'){ claimed = !claimed; render(); }
  if(e.key === 'p' || e.key === 'P'){ if(scene === 0){ payslip = !payslip; reach = false; render(); } }
  if(e.key === 'w' || e.key === 'W'){ if(scene === 0){ reach = !reach; payslip = false; render(); } }
  if(e.key === 't' || e.key === 'T'){ if(scene === 3){ taxcode = !taxcode; render(); } }
});

render();

/* ============================================================
   SANITY TABLE — call sanityTable() in the console when writing
   the script. Outputs markdown to paste straight in. Never
   hand-type these figures.
   ============================================================ */
function sanityTable(){
  const rows = [[60000,4000],[100000,4000],[100000,8000],[110000,4000],[130000,4000]];
  const head = ['Salary','You pay','In the pot','Tax before','Tax after','Back to you','Net cost','PA restored'];
  const body = rows.map(([sal,n])=>{
    const m = model(sal,n);
    return [gbp(sal), gbp(m.net), gbp(m.gross), gbp(m.before), gbp(m.after),
            gbp(m.relief), gbp(m.outOfPocket), gbp(m.paGain)];
  });
  const w = head.map((h,i)=> Math.max(h.length, ...body.map(r=>r[i].length)));
  const line = (cells) => '| ' + cells.map((c,i)=>c.padEnd(w[i])).join(' | ') + ' |';
  const out = [
    'SANITY TABLE — ' + TAX_YEAR + ' · ' + JURIS,
    line(head),
    '|' + w.map(n=>'-'.repeat(n+2)).join('|') + '|',
    ...body.map(line)
  ].join('\n');
  console.log(out);
  return out;
}
window.sanityTable = sanityTable;
</script>
